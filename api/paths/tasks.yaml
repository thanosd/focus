    description: Marks the task completed. For repeating tasks the next occurrence is created and returned as next_task.
    operationId: completeTask
    parameters:
      - name: taskId
        in: path
        required: true
        description: Task ID
        schema:
          type: string
          format: uuid
    responses:
      "200":
        description: Success
        content:
          application/json:
            schema:
