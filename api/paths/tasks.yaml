        required: true
        description: Task ID
        schema:
          type: string
          format: uuid
    responses:
      "200":
        description: Success
        content:
          application/json:
            schema:
              $ref: ../schemas/tasks.yaml#/Task
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/Error
      "404":
        description: Not found
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/Error
    security:
      - cookieAuth: []
  patch:
    tags:
      - tasks
    summary: Update a task
    operationId: updateTask
    parameters:
      - name: taskId
        in: path
        required: true
        description: Task ID
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/tasks.yaml#/UpdateTaskRequest
    responses:
      "200":
        description: Success
        content:
          application/json:
            schema:
              $ref: ../schemas/tasks.yaml#/Task
      "400":
        description: Bad request
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/Error
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/Error
      "404":
        description: Not found
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/Error
    security:
      - cookieAuth: []
  delete:
    tags:
      - tasks
    summary: Delete a task
    operationId: deleteTask
    parameters:
      - name: taskId
        in: path
        required: true
        description: Task ID
        schema:
          type: string
          format: uuid
    responses:
      "200":
        description: Success
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/OkResponse
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/Error
      "404":
        description: Not found
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/Error
    security:
      - cookieAuth: []

