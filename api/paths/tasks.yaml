# Task endpoints

/api/tasks:
  get:
    tags:
      - tasks
    summary: List tasks
    description: Defaults to view=available when no filter is given.
    operationId: listTasks
    parameters:
      - name: view
        in: query
        required: false
        description: Named view. inbox = no project; available = active and not deferred; flagged = urgent; due = has a due date (soonest first); completed = recently completed; all = every active task
        schema:
          type: string
          enum: [inbox, available, flagged, due, completed, all]
      - name: project_id
        in: query
        required: false
        description: Only tasks in this project
        schema:
          type: string
          format: uuid
      - name: include_subprojects
        in: query
        required: false
        description: With project_id, also include tasks of every sub-project (the whole subtree)
        schema:
          type: boolean
      - name: tag_id
        in: query
        required: false
        description: Only tasks carrying this tag
        schema:
          type: string
          format: uuid
      - name: q
        in: query
        required: false
        description: Case-insensitive title/note search
        schema:
          type: string
    responses:
      "200":
        description: Success
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: ../schemas/tasks.yaml#/Task
      "400":
        description: Bad request
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/Error
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/Error
    security:
      - cookieAuth: []
  post:
    tags:
      - tasks
    summary: Create a task
    description: Creates a task. Without project_id it lands in the inbox.
    operationId: createTask
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/tasks.yaml#/CreateTaskRequest
    responses:
      "201":
        description: Success
        content:
          application/json:
            schema:
              $ref: ../schemas/tasks.yaml#/Task
      "400":
        description: Bad request
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/Error
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/Error
    security:
      - cookieAuth: []

