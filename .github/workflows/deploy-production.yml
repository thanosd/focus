name: Deploy to Production

# Production-only pipeline (no staging environment for Focus): every push
# to main that passes checks builds multi-arch images, pushes them to ECR
# and helm-upgrades the focus namespace on the Cosmic cluster.

on:
  push:
    branches:
      - main

  workflow_dispatch: {}

# Serialize deploys — back-to-back merges would otherwise race on the
# same Helm release ("another operation in progress").
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  # AWS
  AWS_ACCOUNT_ID: "131925870818"
  AWS_REGION: us-east-1
  ECR_REGISTRY: 131925870818.dkr.ecr.us-east-1.amazonaws.com
  AWS_ROLE_ARN: arn:aws:iam::131925870818:role/focus-deploy
  EKS_CLUSTER: cosmic-cluster
  SECRET_ID: cosmic/focus/production
  NAMESPACE: focus
  # Application
  APP_DOMAIN: focus.cosmicteacups.com
  API_DOMAIN: focus-api.cosmicteacups.com
  NEXT_PUBLIC_API_URL: https://focus-api.cosmicteacups.com
  FRONTEND_URL: https://focus.cosmicteacups.com
  API_URL: https://focus-api.cosmicteacups.com
  CORS_ORIGINS: https://focus.cosmicteacups.com
  # Temporal worker (nightly maintenance). Requires the focus-temporal
  # namespace to be healthy; see docs/deploy/setup-checklist.md step 8.
  WORKER_ENABLED: "true"

permissions:
  contents: read

jobs:
  trunk-check:
    name: Trunk Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Trunk
        uses: trunk-io/trunk-action@v1
        with:
          check-mode: all

  go-check:
    name: Go Build & Test
    runs-on: ubuntu-latest
    # Real Postgres for the integration tests: deterministic, no binary
    # download from Maven Central at test time (that lookup is what broke
    # the Go job). backend/internal/testdb uses TEST_DATABASE_URL when set.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Install the exact toolchain go.mod pins (not the `go` directive) so
      # Go never auto-downloads a toolchain in CI. With the download, the
      # setup-go module cache restores a half-extracted toolchain and the
      # next run dies with "tar: Cannot open: File exists".
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.8
          cache: true
        env:
          GOTOOLCHAIN: local

      - name: Build, vet, test
        env:
          GOTOOLCHAIN: local
          TZ: UTC
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable # checkov:skip=CKV_SECRET_4:CI-only throwaway credential
        run: |
          go build ./backend/...
          go vet ./backend/...
          go test ./backend/...

  typescript-check:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run TypeScript check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

  build-backend:
    name: Build & Push Backend
    runs-on: ubuntu-latest
    needs: [trunk-check, go-check, typescript-check]
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # QEMU emulates arm64 for the non-native half of the multi-arch build.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.ECR_REGISTRY }}/focus-backend
          # The sha tag must outrank `latest` (raw tags default to priority
          # 200, sha to 100) so the `version` output — which becomes the Helm
          # image tag — changes every commit. With `latest` as the version the
          # pod template never changed and nothing rolled out.
          tags: |
            type=sha,prefix=main-,priority=1000
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
          platforms: linux/amd64,linux/arm64

      - name: Verify multi-arch manifest
        run: |
          TAG="$(echo "${{ steps.meta.outputs.tags }}" | head -n1)"
          docker buildx imagetools inspect "$TAG" | tee manifest.txt
          grep -q "linux/amd64" manifest.txt
          grep -q "linux/arm64" manifest.txt

      # The manifest only proves per-arch entries exist; read the ELF
      # e_machine bytes of the arm64 variant: 0xb7 = aarch64.
      - name: Verify arm64 binary architecture
        run: |
          TAG="$(echo "${{ steps.meta.outputs.tags }}" | head -n1)"
          MACHINE=$(docker run --rm --platform linux/arm64 --entrypoint /bin/sh "$TAG" \
            -c 'od -An -tx1 -j18 -N2 /app/focus' | tr -d ' \n')
          echo "ELF e_machine: $MACHINE (b700=aarch64, 3e00=x86-64)"
          test "$MACHINE" = "b700"

    outputs:
      image-tag: ${{ steps.meta.outputs.version }}

  build-frontend:
    name: Build & Push Frontend
    runs-on: ubuntu-latest
    needs: [trunk-check, go-check, typescript-check]
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.ECR_REGISTRY }}/focus-frontend
          # The sha tag must outrank `latest` (raw tags default to priority
          # 200, sha to 100) so the `version` output — which becomes the Helm
          # image tag — changes every commit. With `latest` as the version the
          # pod template never changed and nothing rolled out.
          tags: |
            type=sha,prefix=main-,priority=1000
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          platforms: linux/amd64,linux/arm64
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }}

      - name: Verify multi-arch manifest
        run: |
          TAG="$(echo "${{ steps.meta.outputs.tags }}" | head -n1)"
          docker buildx imagetools inspect "$TAG" | tee manifest.txt
          grep -q "linux/amd64" manifest.txt
          grep -q "linux/arm64" manifest.txt

    outputs:
      image-tag: ${{ steps.meta.outputs.version }}

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure kubectl for EKS
        run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER }} --region ${{ env.AWS_REGION }}

      - name: Install Helm
        uses: azure/setup-helm@v4

      # Pull the single JSON secret and camelCase each key into Helm
      # values (DATABASE_URL -> databaseUrl). Keys not in the chart's
      # secrets block are ignored by the templates.
      - name: Fetch Secrets from AWS Secrets Manager
        run: |
          SECRET_JSON=$(aws secretsmanager get-secret-value \
            --secret-id ${{ env.SECRET_ID }} \
            --query SecretString --output text)

          echo "::add-mask::$SECRET_JSON"

          echo "secrets:" > k8s/secrets-values.yaml
          echo "$SECRET_JSON" | jq -r '
            def to_camel:
              split("_") |
              .[0] |= ascii_downcase |
              .[1:][] |= (.[0:1] | ascii_upcase) + (.[1:] | ascii_downcase) |
              join("");
            to_entries[] |
            "  \(.key | to_camel): \(.value | @json)"
          ' >> k8s/secrets-values.yaml

      # Failed pre-upgrade migration Jobs linger until the next upgrade
      # deletes them; dump their logs so a hook failure is diagnosable.
      - name: Capture prior migration Job state (diagnostics)
        run: |
          kubectl get pods -n ${{ env.NAMESPACE }} -o wide || true
          for pod in $(kubectl get pods -n ${{ env.NAMESPACE }} -l app.kubernetes.io/component=migration -o name 2>/dev/null); do
            echo "=== $pod"
            kubectl describe -n ${{ env.NAMESPACE }} "$pod" | tail -40 || true
            echo "--- logs:"
            kubectl logs -n ${{ env.NAMESPACE }} "$pod" --tail=100 || true
          done

      - name: Deploy to Production
        run: |
          cd k8s

          cat <<EOF > helm-values.yaml
          imageRegistry: ${{ env.ECR_REGISTRY }}
          secrets:
            corsOrigins: "${{ env.CORS_ORIGINS }}"
            nextPublicApiUrl: "${{ env.NEXT_PUBLIC_API_URL }}"
            frontendUrl: "${{ env.FRONTEND_URL }}"
            apiUrl: "${{ env.API_URL }}"
          backend:
            image:
              repository: focus-backend
              tag: ${{ needs.build-backend.outputs.image-tag }}
          frontend:
            image:
              repository: focus-frontend
              tag: ${{ needs.build-frontend.outputs.image-tag }}
          worker:
            # Temporal is installed separately (k8s/install-temporal.sh). Keep the
            # worker off until it is healthy, otherwise its crash loop fails the
            # whole --atomic rollout. Flip to true once `kubectl get pods -n
            # focus-temporal` is all Running.
            enabled: ${{ env.WORKER_ENABLED }}
            image:
              repository: focus-backend
              tag: ${{ needs.build-backend.outputs.image-tag }}
          EOF

          helm upgrade --install focus ./focus \
            --namespace ${{ env.NAMESPACE }} \
            --create-namespace \
            --values focus/values.yaml \
            --values helm-values.yaml \
            --values secrets-values.yaml \
            --wait \
            --timeout 5m \
            --cleanup-on-fail \
            --atomic

      - name: Wait for Rollout
        run: |
          kubectl rollout status deployment/focus-backend -n ${{ env.NAMESPACE }} --timeout=5m
          kubectl rollout status deployment/focus-frontend -n ${{ env.NAMESPACE }} --timeout=5m
          if [ "${{ env.WORKER_ENABLED }}" = "true" ]; then
            kubectl rollout status deployment/focus-worker -n ${{ env.NAMESPACE }} --timeout=5m
          fi
