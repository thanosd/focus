# yamllint disable-file
apiVersion: v1
kind: Secret
metadata:
  name: "{{ include "focus.fullname" . }}-secrets"
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "focus.labels" . | nindent 4 }}
  annotations:
    # Hook so it exists before the migration job (also a hook).
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/resource-policy": keep
type: Opaque
stringData:
  databaseUrl: {{ .Values.secrets.databaseUrl | quote }}
  corsOrigins: {{ .Values.secrets.corsOrigins | quote }}
  frontendUrl: {{ .Values.secrets.frontendUrl | quote }}
  apiUrl: {{ .Values.secrets.apiUrl | quote }}
  nextPublicApiUrl: {{ .Values.secrets.nextPublicApiUrl | quote }}
  googleClientId: {{ .Values.secrets.googleClientId | quote }}
  googleClientSecret: {{ .Values.secrets.googleClientSecret | quote }}
  authAllowedEmails: {{ .Values.secrets.authAllowedEmails | quote }}
  csrfAuthKey: {{ .Values.secrets.csrfAuthKey | quote }}
  # Optional: without it the natural-language date parser is rules-only.
  claudeApiKey: {{ .Values.secrets.claudeApiKey | quote }}
  # Stable AES key for Next.js Server Actions — must be identical across
  # replicas and stable across deploys (openssl rand -base64 32).
  nextServerActionsEncryptionKey: {{ .Values.secrets.nextServerActionsEncryptionKey | quote }}
