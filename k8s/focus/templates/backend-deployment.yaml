# yamllint disable-file
{{- if .Values.backend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "focus.fullname" . }}-backend
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "focus.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      {{- include "focus.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        {{- include "focus.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: backend
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name | default "focus" }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: backend
          image: "{{ .Values.imageRegistry }}/{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          args: ["server"]
          ports:
            - name: http
              containerPort: {{ .Values.backend.service.port }}
              protocol: TCP
          env:
            - name: ENVIRONMENT
              value: {{ .Values.backend.env.ENVIRONMENT | quote }}
            - name: PROJECT_NAME
              value: {{ .Values.backend.env.PROJECT_NAME | quote }}
            - name: VERSION
              value: {{ .Values.backend.env.VERSION | quote }}
            - name: CLAUDE_MODEL
              value: {{ .Values.backend.env.CLAUDE_MODEL | quote }}
            - name: TEMPORAL_HOST
              value: {{ .Values.worker.temporal.host | quote }}
            - name: TEMPORAL_NAMESPACE
              value: {{ .Values.worker.temporal.namespace | quote }}
            {{- range $key := list "DATABASE_URL:databaseUrl" "BACKEND_CORS_ORIGINS:corsOrigins" "FRONTEND_URL:frontendUrl" "API_URL:apiUrl" "GOOGLE_CLIENT_ID:googleClientId" "GOOGLE_CLIENT_SECRET:googleClientSecret" "AUTH_ALLOWED_EMAILS:authAllowedEmails" "CSRF_AUTH_KEY:csrfAuthKey" "CLAUDE_API_KEY:claudeApiKey" }}
            {{- $parts := splitList ":" $key }}
            - name: {{ index $parts 0 }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "focus.fullname" $ }}-secrets
                  key: {{ index $parts 1 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
