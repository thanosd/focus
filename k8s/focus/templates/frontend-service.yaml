# yamllint disable-file
{{- if .Values.frontend.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "focus.fullname" . }}-frontend
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "focus.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: {{ .Values.frontend.service.type }}
  ports:
    - port: {{ .Values.frontend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "focus.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
{{- end }}